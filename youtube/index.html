<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유튜브 레시피 추출기 — K1 Recipe</title>
<meta name="description" content="유튜브 링크에서 재료, 조리순서와 팁을 자동 추출해 한눈에 확인하세요.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
  --ink:#16130f; --ink-60:rgba(22,19,15,.62); --ink-30:rgba(22,19,15,.3);
  --paper:#ffffff; --rice:#faf6f0;
  --k1:#e84e1b; --k1-deep:#b93a10; --k1-bg:#fff5f0;
  --line:rgba(22,19,15,.09);
  --disp:"Pretendard Variable",Pretendard,-apple-system,sans-serif;
  --latin:"Space Grotesk",var(--disp);
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --shadow:0 2px 12px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--disp);color:var(--ink);background:var(--rice);line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.wrap{width:min(1160px,92%);margin:0 auto}

/* ===== NAV ===== */
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:baseline;gap:.55rem}
.logo .k1{font-family:var(--latin);font-weight:700;font-size:1.35rem;color:var(--k1)}
.logo .by{font-size:.72rem;font-weight:600;letter-spacing:.08em;color:var(--ink-60)}
.nav-links{display:flex;gap:1.6rem;font-size:.88rem;font-weight:600}
.nav-links a{color:var(--ink-60);padding:.3rem 0;transition:color .25s}
.nav-links a:hover,.nav-links a.active{color:var(--k1)}
.nav-side{display:flex;align-items:center;gap:.8rem}.lang-selector{position:relative}.lang-button{display:flex;align-items:center;gap:.4rem;padding:.48rem .65rem;border:1px solid var(--line);border-radius:100px;background:#fff;color:var(--ink-60);font-size:.8rem;font-weight:700}.lang-menu{position:absolute;right:0;top:calc(100% + .5rem);min-width:140px;padding:.35rem;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(-5px);transition:.2s}.lang-selector.open .lang-menu{opacity:1;visibility:visible;transform:none}.lang-menu button{display:block;width:100%;padding:.55rem .65rem;border-radius:8px;text-align:left;font-size:.82rem;color:var(--ink-60)}.lang-menu button:hover,.lang-menu button.active{background:var(--rice);color:var(--k1);font-weight:700}
@media(max-width:640px){.nav-links{gap:.7rem;font-size:.76rem}.logo .by,.lang-name{display:none}.lang-button{padding:.48rem}.nav-in{gap:.5rem}.nav-side{gap:.5rem}}
@media(max-width:450px){.nav-links a:first-child{display:none}}

/* ===== HERO ===== */
.hero{text-align:center;padding:56px 24px 32px}
.yt-icon{width:100px;height:70px;margin:0 auto 20px;background:#ff0000;border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(255,0,0,.18)}
.yt-icon::after{content:'';border-left:24px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:3px}
.hero h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;margin-bottom:6px}
.hero h1 .badge{display:inline-block;background:var(--k1-bg);color:var(--k1);font-size:.75rem;padding:2px 10px;border-radius:20px;vertical-align:middle;margin-left:6px;font-weight:600}
.hero p{color:var(--ink-60);font-size:.95rem;max-width:440px;margin:0 auto}
.hero p strong{color:var(--k1)}

/* ===== INPUT BAR ===== */
.input-section{max-width:640px;margin:0 auto 40px;padding:0 24px}
.input-bar{display:flex;align-items:center;background:#fff;border:2px solid var(--line);border-radius:60px;padding:5px 5px 5px 20px;box-shadow:var(--shadow);transition:border-color .3s}
.input-bar:focus-within{border-color:var(--k1)}
.input-bar .icon{font-size:18px;color:var(--ink-30);margin-right:10px}
.input-bar input{flex:1;border:none;outline:none;font-size:15px;background:transparent;min-width:0}
.input-bar input::placeholder{color:var(--ink-30)}
.input-bar button{background:var(--k1);color:#fff;border-radius:50px;padding:11px 24px;font-size:14px;font-weight:700;transition:background .2s;white-space:nowrap}
.input-bar button:hover{background:var(--k1-deep)}
.input-bar button:disabled{background:#ccc;cursor:not-allowed}

/* ===== LOADING / ERROR ===== */
.loading{display:none;text-align:center;padding:48px 24px}
.loading.active{display:block}
.spinner{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--k1);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--ink-60);font-size:14px}
.error-msg{display:none;max-width:640px;margin:0 auto 24px;padding:14px 20px;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;color:#dc2626;font-size:13px}
.error-msg.active{display:block}

/* ===== RESULT ===== */
.result{display:none;max-width:840px;margin:0 auto;padding:0 24px 60px}
.result.active{display:block}
.video-section{background:#fff;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px}
.video-embed{position:relative;padding-bottom:56.25%;height:0;background:#000}
.video-embed iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.video-meta{padding:18px 22px}
.video-meta .rating{color:#f59e0b;font-size:16px;margin-bottom:6px}
.video-meta h2{font-size:clamp(1.1rem,3vw,1.5rem);font-weight:800;margin-bottom:2px}
.video-meta .channel{color:var(--ink-60);font-size:13px;margin-bottom:10px}
.meta-pills{display:flex;gap:14px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-60)}

/* TABS */
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:20px;background:#fff;border-radius:var(--r-lg) var(--r-lg) 0 0;overflow-x:auto}
.tabs button{flex:1;padding:14px 18px;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--ink-30);border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tabs button.active{color:var(--k1);border-bottom-color:var(--k1)}
.tab-content{display:none}.tab-content.active{display:block}

/* INGREDIENTS */
.ingredients-card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:18px 22px 10px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.ingredient-table{width:100%;border-collapse:collapse}
.ingredient-table tr{border-bottom:1px solid #f0f0f0}
.ingredient-table tr:last-child{border:none}
.ingredient-table td{padding:12px 22px;font-size:14px}
.ingredient-table td:first-child{font-weight:500}
.ingredient-table td:last-child{text-align:right;color:var(--ink-60);font-weight:500}
.ingredient-table tr:nth-child(even){background:#fafafa}

/* STEPS */
.steps-list{display:flex;flex-direction:column;gap:14px}
.step-card{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;transition:transform .2s}
.step-card:hover{transform:translateY(-2px)}
.step-header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:#fafafa;border-bottom:1px solid #f0f0f0}
.step-badge{display:flex;align-items:center;gap:8px}
.step-number{background:var(--k1);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.step-counter{font-size:13px;color:var(--ink-60);font-weight:600}
.step-timestamp{background:var(--k1-bg);color:var(--k1);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:background .2s}
.step-timestamp:hover{background:var(--k1);color:#fff}
.step-body{padding:14px 22px}
.step-title{font-size:15px;font-weight:700;margin-bottom:4px}
.step-desc{font-size:13px;color:var(--ink-60);line-height:1.7}

/* TIPS */
.tips-card{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--r-lg);padding:18px 22px}
.tips-card h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.tips-card ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.tips-card li{padding-left:20px;position:relative;font-size:13px;color:var(--ink-60)}
.tips-card li::before{content:'💡';position:absolute;left:0}

/* EXPORT */
.export-section{margin-top:20px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.export-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:13px;font-weight:600;transition:all .2s}
.export-btn:hover{border-color:var(--k1);color:var(--k1)}

/* FOOTER */
footer{background:var(--ink);color:rgba(255,255,255,.5);text-align:center;padding:28px 24px;font-size:.76rem;margin-top:40px}
footer a{color:var(--k1);font-weight:600}

/* ===== SAVED RECIPES GALLERY ===== */
.saved-section{max-width:840px;margin:0 auto 40px;padding:0 24px}
.saved-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.saved-header h2{font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:8px}
.saved-header .count{font-size:.85rem;color:var(--ink-60);font-weight:400}
.saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.recipe-card{background:#fff;border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.recipe-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.recipe-card .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#f0f0f0}
.recipe-card .card-body{padding:14px 16px}
.recipe-card .card-title{font-size:15px;font-weight:700;margin-bottom:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recipe-card .card-desc{font-size:12px;color:var(--ink-60);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.recipe-card .card-meta{display:flex;gap:10px;font-size:11px;color:var(--ink-30)}
.recipe-card .card-meta span{display:flex;align-items:center;gap:3px}
.saved-empty{text-align:center;padding:40px 20px;color:var(--ink-30);font-size:14px}
.saved-badge{display:inline-flex;align-items:center;gap:4px;background:#ecfdf5;color:#059669;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-left:8px}
@media(max-width:560px){.saved-grid{grid-template-columns:1fr 1fr}.recipe-card .card-desc{display:none}}
</style>
</head>
<body>

<!-- NAV — K1 통합 메뉴 -->
<nav>
  <div class="wrap nav-in">
    <a class="logo" href="../">
      <span class="k1">K1</span><span class="by">STICK SAUCE</span>
    </a>
    <div class="nav-side">
      <div class="nav-links">
        <a href="../" data-yt-i18n="story">K1 스토리</a>
        <a href="../recipe/" data-yt-i18n="recipes">K1 레시피</a>
        <a href="./" class="active" data-yt-i18n="youtube">유튜브 레시피</a>
      </div>
      <div class="lang-selector" id="ytLangSelector">
        <button class="lang-button" id="ytLangButton" type="button" aria-label="Language"><span id="ytLangFlag">🇰🇷</span><span class="lang-name" id="ytLangName">한국어</span><i class="fa-solid fa-chevron-down"></i></button>
        <div class="lang-menu"><button type="button" data-lang="ko">🇰🇷 한국어</button><button type="button" data-lang="en">🇺🇸 English</button><button type="button" data-lang="ja">🇯🇵 日本語</button><button type="button" data-lang="zh">🇨🇳 中文</button></div>
      </div>
    </div>
  </div>
</nav>

<!-- HERO + INPUT -->
<section class="hero">
  <div class="yt-icon"></div>
  <h1><span data-yt-i18n="hero">유튜브 레시피 가져오기</span> <span class="badge">Beta</span></h1>
  <p data-yt-i18n-html="heroDesc">링크만 붙여넣으면 유튜브 레시피 추출이 자동으로 끝나요.<br><strong>영상과 레시피를 한눈에</strong> 보며 더 편하게 요리하세요.</p>
</section>

<section class="input-section">
  <div class="input-bar">
    <span class="icon"><i class="fa-solid fa-magnifying-glass"></i></span>
    <input type="text" id="urlInput" placeholder="유튜브 링크를 붙여넣으세요" data-yt-i18n-placeholder="placeholder" autocomplete="off">
    <button id="extractBtn" onclick="startExtract()" data-yt-i18n="extract">추출하기</button>
  </div>
</section>

<div class="error-msg" id="errorMsg"></div>

<!-- SAVED RECIPES GALLERY -->
<div class="saved-section" id="savedSection" style="display:none">
  <div class="saved-header">
    <h2>📚 <span data-yt-i18n="saved">저장된 레시피</span> <span class="count" id="savedCount"></span></h2>
  </div>
  <div class="saved-grid" id="savedGrid"></div>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <p id="loadingText" data-yt-i18n="loading">레시피를 분석하고 있어요...</p>
  <p style="color:var(--ink-30);font-size:12px;margin-top:6px" id="loadingStep" data-yt-i18n="loadingInitial">자막을 가져오는 중</p>
</div>

<!-- RESULT -->
<div class="result" id="result">
  <div class="video-section">
    <div class="video-embed">
      <iframe id="ytPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="video-meta">
      <div class="rating" id="ratingStars">★★★★★</div>
      <h2 id="recipeTitle">-</h2>
      <div class="channel" id="channelName">-</div>
      <div class="meta-pills">
        <div class="pill"><i class="fa-regular fa-clock"></i> <span id="metaCookTime">-</span></div>
        <div class="pill"><i class="fa-solid fa-users"></i> <span id="metaServings">-</span></div>
        <div class="pill"><i class="fa-solid fa-chart-simple"></i> <span id="metaDifficulty">-</span></div>
        <div class="pill"><i class="fa-solid fa-closed-captioning"></i> <span data-yt-i18n="transcript">자막</span> <span id="metaTranscript">-</span><span data-yt-i18n="lines">줄</span></div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="active" onclick="switchTab('ingredients')" data-yt-i18n="ingredients">🥬 재료</button>
    <button onclick="switchTab('steps')" data-yt-i18n="steps">👨‍🍳 조리순서</button>
    <button onclick="switchTab('tips')" data-yt-i18n="tips">💡 팁</button>
  </div>

  <div class="tab-content active" id="tab-ingredients">
    <div class="ingredients-card">
      <div class="card-header"><span data-yt-i18n="ingredients">🥬 재료</span> <span id="ingredientCount" style="color:var(--ink-30);font-size:13px;font-weight:400"></span></div>
      <table class="ingredient-table" id="ingredientTable"><tbody></tbody></table>
    </div>
  </div>
  <div class="tab-content" id="tab-steps">
    <div class="steps-list" id="stepsList"></div>
  </div>
  <div class="tab-content" id="tab-tips">
    <div class="tips-card" id="tipsCard">
      <h3 data-yt-i18n="cookingTips">💡 요리 팁</h3>
      <ul id="tipsList"></ul>
    </div>
  </div>

</div>

<footer>
  <div class="wrap">© 2026 Bitelabs · <a href="../">K1 Stick Sauce</a> · <a href="../recipe/" data-yt-i18n="footerRecipes">레시피</a></div>
</footer>

<script src="i18n.js"></script>
<script>
// ========== CONFIG ==========
// Render 배포 후 이 URL을 실제 서버 주소로 교체
const API_URL = 'https://k1-api.onrender.com';

let currentData = null;
const yt = (key, values) => K1YouTubeI18n.t(key, values);

function tsToSeconds(ts) {
  const p = ts.split(':').map(Number);
  return p.length === 3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+(p[1]||0);
}

function switchTab(name) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector('#tab-'+name).classList.add('active');
  const btns = document.querySelectorAll('.tabs button');
  ({ingredients:0,steps:1,tips:2})[name] !== undefined && btns[({ingredients:0,steps:1,tips:2})[name]].classList.add('active');
}

function seekTo(ts) {
  const s = tsToSeconds(ts);
  const iframe = document.getElementById('ytPlayer');
  if (currentData) iframe.src = 'https://www.youtube.com/embed/'+currentData.videoId+'?start='+s+'&autoplay=1';
  document.querySelector('.video-section').scrollIntoView({behavior:'smooth'});
}

async function startExtract() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { showError(yt('required')); return; }
  hideError();
  document.getElementById('result').classList.remove('active');
  document.getElementById('loading').classList.add('active');
  document.getElementById('extractBtn').disabled = true;

  const steps = [yt('loadVideo'),yt('loadTranscript'),yt('loadAI'),yt('loadFinish')];
  document.getElementById('loadingStep').textContent = steps[0];
  let si = 0;
  const timer = setInterval(() => { si = Math.min(si+1,steps.length-1); document.getElementById('loadingStep').textContent = steps[si]; }, 4000);

  try {
    const resp = await fetch(API_URL+'/api/extract', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({url, language:K1YouTubeI18n.language}),
    });
    const data = await resp.json();
    clearInterval(timer);
    if (!resp.ok || data.error) throw new Error(data.error || yt('unknown'));
    currentData = data;
    renderResult(data);
    if (data.saved) loadSavedRecipes(); // 갤러리 새로고침
  } catch(err) {
    clearInterval(timer);
    if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
      showError(yt('network'));
    } else { showError(err.message); }
  } finally {
    document.getElementById('loading').classList.remove('active');
    document.getElementById('extractBtn').disabled = false;
  }
}

function showError(msg) { const el=document.getElementById('errorMsg'); el.textContent='❌ '+msg; el.classList.add('active'); }
function hideError() { document.getElementById('errorMsg').classList.remove('active'); }
function difficultyLabel(d) { return {easy:yt('easy'),medium:yt('medium'),hard:yt('hard')}[d]||d; }

function renderResult(data) {
  const {videoId,videoInfo,recipe,transcriptLength} = data;
  document.getElementById('ytPlayer').src = 'https://www.youtube.com/embed/'+videoId+'?enablejsapi=1';
  document.getElementById('recipeTitle').textContent = recipe.title||videoInfo.title;
  document.getElementById('channelName').textContent = videoInfo.channel ? '📺 '+videoInfo.channel : '';
  document.getElementById('metaCookTime').textContent = recipe.cookTime||'-';
  document.getElementById('metaServings').textContent = recipe.servings||'-';
  document.getElementById('metaDifficulty').textContent = difficultyLabel(recipe.difficulty);
  document.getElementById('metaTranscript').textContent = transcriptLength;

  const tbody = document.querySelector('#ingredientTable tbody');
  tbody.innerHTML = '';
  const ings = recipe.ingredients||[];
  document.getElementById('ingredientCount').textContent = yt('ingredientCount',{count:ings.length});
  ings.forEach(i => { const tr=document.createElement('tr'); tr.innerHTML='<td>'+i.name+'</td><td>'+(i.amount||'')+'</td>'; tbody.appendChild(tr); });

  const stepsList = document.getElementById('stepsList');
  stepsList.innerHTML = '';
  (recipe.steps||[]).forEach((s,i,arr) => {
    const c=document.createElement('div'); c.className='step-card';
    c.innerHTML='<div class="step-header"><div class="step-badge"><div class="step-number">'+(s.step||i+1)+'</div><span class="step-counter">'+yt('step')+' '+(s.step||i+1)+'/'+arr.length+'</span></div>'+(s.timestamp?'<button class="step-timestamp" onclick="seekTo(\''+s.timestamp+'\')">'+s.timestamp+'</button>':'')+'</div><div class="step-body"><div class="step-title">'+(s.title||'')+'</div><div class="step-desc">'+(s.description||'')+'</div></div>';
    stepsList.appendChild(c);
  });

  const tipsList = document.getElementById('tipsList');
  tipsList.innerHTML = '';
  const tips = recipe.tips||[];
  if (!tips.length) tipsList.innerHTML='<li>'+yt('noTips')+'</li>';
  else tips.forEach(t => { const li=document.createElement('li'); li.textContent=t; tipsList.appendChild(li); });

  document.getElementById('result').classList.add('active');
  switchTab('ingredients');
  document.querySelector('.video-section').scrollIntoView({behavior:'smooth',block:'start'});
}

function exportJSON() {
  if(!currentData) return;
  navigator.clipboard.writeText(JSON.stringify(currentData,null,2)).then(()=>alert(yt('copySuccess'))).catch(()=>alert(yt('copyFail')));
}
function downloadJSON() {
  if(!currentData) return;
  const b=new Blob([JSON.stringify(currentData,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='recipe_'+currentData.videoId+'.json'; a.click();
}

// ========== SAVED RECIPES ==========
async function loadSavedRecipes() {
  try {
    const resp = await fetch(API_URL+'/api/recipes?limit=12');
    if (!resp.ok) return;
    const recipes = await resp.json();
    const section = document.getElementById('savedSection');
    const grid = document.getElementById('savedGrid');
    if (!recipes.length) { section.style.display='none'; return; }
    section.style.display='block';
    document.getElementById('savedCount').textContent = yt('count',{count:recipes.length});
    grid.innerHTML = '';
    recipes.forEach(r => {
      const card = document.createElement('div');
      card.className = 'recipe-card';
      card.onclick = () => loadRecipeDetail(r.video_id);
      card.innerHTML = `
        <img class="thumb" src="${r.video_thumbnail||'https://img.youtube.com/vi/'+r.video_id+'/hqdefault.jpg'}" alt="${r.recipe_title}" onerror="this.src='https://img.youtube.com/vi/${r.video_id}/hqdefault.jpg'">
        <div class="card-body">
          <div class="card-title">${r.recipe_title}</div>
          <div class="card-desc">${r.recipe_description||''}</div>
          <div class="card-meta">
            ${r.cook_time?'<span><i class="fa-regular fa-clock"></i> '+r.cook_time+'</span>':''}
            ${r.servings?'<span><i class="fa-solid fa-users"></i> '+r.servings+'</span>':''}
            ${r.difficulty?'<span>'+difficultyLabel(r.difficulty)+'</span>':''}
          </div>
        </div>`;
      grid.appendChild(card);
    });
  } catch(e) { console.log('저장된 레시피 로드 실패:', e); }
}

async function loadRecipeDetail(videoId) {
  try {
    const resp = await fetch(API_URL+'/api/recipes/'+videoId);
    if (!resp.ok) return;
    const r = await resp.json();
    currentData = {
      videoId: r.video_id,
      videoInfo: { title: r.video_title, channel: r.video_channel, thumbnail: r.video_thumbnail },
      recipe: {
        title: r.recipe_title, description: r.recipe_description,
        servings: r.servings, cookTime: r.cook_time, difficulty: r.difficulty,
        ingredients: r.ingredients, steps: r.steps, tips: r.tips
      },
      transcriptLength: r.transcript_length
    };
    renderResult(currentData);
  } catch(e) { showError(yt('detailFail',{error:e.message})); }
}

// 페이지 로드 시 저장된 레시피 표시
loadSavedRecipes();

document.addEventListener('k1:youtube-language', () => {
  if (currentData) renderResult(currentData);
  loadSavedRecipes();
});

document.getElementById('urlInput').addEventListener('keydown', e => { if(e.key==='Enter') startExtract(); });
</script>
