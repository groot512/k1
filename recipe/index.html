<!-- PWA Install Banner -->
<div class="pwa-install-banner" id="pwaInstall" style="display:none">
  <div class="pwa-install-content">
    <img src="icon-192.png" alt="K1" class="pwa-icon">
    <div class="pwa-text">
      <strong>K1 Recipe</strong>
      <span data-i18n="pwa.add">홈 화면에 추가하기</span>
    </div>
    <button class="pwa-install-btn" id="pwaInstallBtn" data-i18n="pwa.install">설치</button>
    <button class="pwa-dismiss" id="pwaDismiss" data-i18n-aria="popup.close" aria-label="닫기"><i class="fa-solid fa-xmark"></i></button>
  </div>
</div>

<script src="app.js"></script>
<script>
// PWA Service Worker Registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW registration failed:', err));
  });
}

// PWA Install Prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('pwaInstall');
  if (banner) banner.style.display = 'flex';
});

const installBtn = document.getElementById('pwaInstallBtn');
if (installBtn) {
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    console.log('Install result:', result.outcome);
    deferredPrompt = null;
    document.getElementById('pwaInstall').style.display = 'none';
  });
}

const dismissBtn = document.getElementById('pwaDismiss');
if (dismissBtn) {
  dismissBtn.addEventListener('click', () => {
    document.getElementById('pwaInstall').style.display = 'none';
  });
}
</script>
